name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'res/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'res/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm run lint

  # The apps and tests build @markii/* from src/ (workspace aliases), so
  # nothing above ever exercises the PUBLISHED artifacts: a packaging bug
  # (a broken exports map, a file missing from `files`, a dist build that
  # does not compile) would sail through test/build/lint and only surface
  # for a real npm consumer. This job packs every library package exactly
  # as the release workflow does and installs the tarballs into a fresh
  # out-of-tree project that imports three points across the dependency
  # graph (@markii/core at the bottom, the zero-React @markii/html renderer,
  # and the zero-React @markii/ansi renderer) and renders a real document
  # through each.
  packed-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:dist

      - name: Pack every library package
        run: |
          set -euo pipefail
          mkdir -p /tmp/markii-tarballs
          for dir in packages/markii-core packages/markii-stdlib \
                     packages/markii-bundle packages/markii-pack \
                     packages/markii-runtime packages/markii-lua \
                     packages/platforms/markii-react packages/platforms/markii-html \
                     packages/platforms/markii-ansi; do
            name=$(node -p "require('./$dir/package.json').name")
            npm pack -w "$name" --pack-destination /tmp/markii-tarballs >/dev/null
          done
          ls -1 /tmp/markii-tarballs

      - name: Install the tarballs into a fresh consumer and render a document
        run: |
          set -euo pipefail
          mkdir /tmp/markii-consumer && cd /tmp/markii-consumer
          npm init -y >/dev/null
          npm pkg set type=module
          # All nine tarballs at once, so @markii/* dependency ranges
          # resolve against the packed versions rather than the registry.
          npm install /tmp/markii-tarballs/*.tgz react@18 react-dom@18 >/dev/null
          cat > smoke.mjs <<'SMOKE'
          import { parse, toHast } from '@markii/core';
          import { renderMarkToHtml } from '@markii/html';
          import { defaultHtmlRegistry } from '@markii/html/components';
          import { renderMarkToAnsi } from '@markii/ansi';
          import { defaultAnsiRegistry } from '@markii/ansi/components';
          import { createValueStore } from '@markii/runtime';
          const doc = [
            '# Packed consumer',
            '',
            ':::callout{type=info title="From the tarballs"}',
            'Rendered through the published artifacts.',
            ':::',
            '',
          ].join('\n');
          parse(doc);
          toHast(doc);
          createValueStore({});
          const html = renderMarkToHtml(doc, defaultHtmlRegistry);
          if (
            !html.includes('From the tarballs') ||
            !html.includes('callout') ||
            html.includes('failed to render')
          ) {
            console.error('unexpected render output:', html.slice(0, 400));
            process.exit(1);
          }
          console.log('packed consumer render OK,', html.length, 'chars');
          const ansi = renderMarkToAnsi(doc, defaultAnsiRegistry, undefined, undefined, {
            width: 80,
            color: 'never',
          });
          if (ansi.length === 0 || ansi.includes('failed to render document')) {
            console.error('unexpected ansi render output:', ansi.slice(0, 400));
            process.exit(1);
          }
          console.log('packed consumer ansi render OK,', ansi.length, 'chars');
          SMOKE
          node smoke.mjs
