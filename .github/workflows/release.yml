# Fires on a pushed `v*.*.*` tag and does two things:
#
#   1. publish-npm    Publishes the eight @markii/* library packages to npm.
#                     Idempotent: any package whose version is already on the
#                     registry is skipped, so re-running a tag (or tagging a
#                     version that was published by hand) is safe and does not
#                     need NPM_TOKEN when nothing new has to go out.
#   2. github-release Packs each package into a stable-named tarball, extracts
#                     the matching section from CHANGELOG.md, and creates (or
#                     updates) the GitHub Release with those tarballs attached.
#   3. vscode-extension  Builds the VS Code extension into a .vsix, attaches
#                     it to the GitHub Release (a versioned name and a stable
#                     markii-vscode.vsix) so it ships as a download, and then
#                     publishes the same .vsix to the VS Code Marketplace via
#                     `vsce publish` (idempotent: a version already listed is
#                     skipped). Needs the VSCE_PAT secret.
#
# Prerequisites for publishing a NEW version to npm:
#   - The `@markii` scope is owned by the publishing account or org.
#   - Each @markii/* package has a Trusted Publisher configured on npmjs.com
#     (Package Settings -> Trusted Publisher) pointing at THIS repo
#     (markii-org/markii) and workflow file (release.yml). No token is used —
#     the `id-token: write` permission below lets `npm publish` authenticate
#     to npm over OIDC, and npm records build provenance automatically.
#   - The legacy `NPM_TOKEN` secret is no longer read by this workflow; it can
#     be left in place as a revert option, or deleted once OIDC is proven.
#
# The stable tarball names mean the newest assets are always reachable at:
#   https://github.com/markii-org/markii/releases/latest/download/markii-core.tgz
#   (and markii-stdlib.tgz, markii-bundle.tgz, markii-pack.tgz,
#    markii-runtime.tgz, markii-lua.tgz, markii-react.tgz, markii-html.tgz)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# The library workspace directories, in dependency order.
env:
  PACKAGE_DIRS: >-
    packages/markii-core
    packages/markii-stdlib
    packages/markii-bundle
    packages/markii-pack
    packages/markii-runtime
    packages/markii-lua
    packages/platforms/markii-react
    packages/platforms/markii-html

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # `id-token: write` is what lets `npm publish` authenticate to npm over
    # OIDC (trusted publishing) with no token; `contents: read` is the
    # default checkout scope, restated because naming `permissions` at all
    # drops every other default to none.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:dist

      # OIDC trusted publishing needs a recent npm CLI (>= 11.5.1); the npm
      # bundled with Node 22 is older, so upgrade before publishing. Placed
      # after ci/test/build so those run on the pinned, cached npm and only
      # the publish step uses the upgraded one.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages whose version is not yet on npm
        run: |
          set -euo pipefail
          for dir in $PACKAGE_DIRS; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on npm, skipping"
            else
              echo "publishing $name@$version"
              npm publish -w "$name" --access public
            fi
          done

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:dist

      - name: Pack tarballs with stable, version-less names
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          for dir in $PACKAGE_DIRS; do
            name=$(node -p "require('./$dir/package.json').name")
            stable=${name/@markii\//markii-}
            npm pack -w "$name" --pack-destination dist-artifacts >/dev/null
            mv dist-artifacts/${stable}-*.tgz "dist-artifacts/${stable}.tgz"
          done
          ls -1 dist-artifacts

      - name: Assemble release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # The CHANGELOG section for this version: everything between its
          # `## [VERSION]` heading and the next `## [` heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes-body.md

          {
            cat notes-body.md
            echo
            echo "## Install"
            echo
            echo 'The renderer pulls the rest in as dependencies:'
            echo
            echo '```'
            echo "npm install @markii/react@${VERSION}"
            echo '```'
            echo
            echo 'All eight packages, if you want them explicitly:'
            echo
            echo '```'
            for pkg in core stdlib bundle pack runtime lua react html; do
              echo "npm install @markii/${pkg}@${VERSION}"
            done
            echo '```'
            echo
            echo "## Downloads"
            echo
            echo 'The attached tarballs are the packed npm packages. The names are'
            echo 'stable across releases, so the latest of each is always at a fixed URL:'
            echo
            echo '```'
            for pkg in core stdlib bundle pack runtime lua react html; do
              echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/markii-${pkg}.tgz"
            done
            echo '```'
          } > RELEASE_NOTES.md

          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" dist-artifacts/*.tgz --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md dist-artifacts/*.tgz
          fi

  vscode-extension:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The extension bundles @markii/* from source (esbuild aliases), so it
      # does not depend on the npm publish above; it only needs the workspace.
      - name: Build and package the extension
        run: |
          set -euo pipefail
          cd apps/vscode
          npm run package
          ls -1 *.vsix

      - name: Attach the .vsix to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VSIX=$(ls apps/vscode/markii-vscode-*.vsix)
          # A stable-named copy so the latest is always at a fixed URL, the
          # same convention the tarballs use.
          cp "$VSIX" markii-vscode.vsix
          gh release upload "$TAG" "$VSIX" markii-vscode.vsix --clobber

      # Publishes the prebuilt .vsix to the VS Code Marketplace. Idempotent
      # like the npm job: if this version is already listed (e.g. a re-run of
      # the whole workflow), it is skipped rather than failing. `vsce` reads
      # the token from the VSCE_PAT env var; the secret must be set on the
      # repo for this step to do anything (if it is empty, vsce fails and the
      # step surfaces it).
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/vscode/package.json').version")
          if npx --yes @vscode/vsce show markii.markii-vscode --json 2>/dev/null \
               | node -e "let s='';process.stdin.on('data',d=>{s+=d}).on('end',()=>{let v=[];try{v=(JSON.parse(s).versions||[]).map((x)=>x.version)}catch{}process.exit(v.includes(process.argv[1])?0:1)})" "$VERSION"; then
            echo "markii.markii-vscode@$VERSION already on the Marketplace, skipping"
          else
            VSIX=$(ls apps/vscode/markii-vscode-*.vsix)
            echo "publishing $VSIX to the Marketplace"
            # The `vsce show` pre-check above races Marketplace propagation: a
            # freshly published version is not listed for several minutes, so a
            # re-run of the same tag reaches this branch and then fails with
            # "already exists" (observed on v0.7.2, whose second run went red
            # for a version its first run had just published successfully).
            # Treating that specific message as success makes the step
            # genuinely idempotent instead of idempotent-when-not-racing.
            PUBLISH_LOG=$(mktemp)
            if npx --yes @vscode/vsce publish --packagePath "$VSIX" 2>&1 | tee "$PUBLISH_LOG"; then
              echo "published $VSIX"
            elif grep -qi 'already exists' "$PUBLISH_LOG"; then
              echo "markii.markii-vscode@$VERSION was already published (propagation race), treating as success"
            else
              echo "vsce publish failed" >&2
              exit 1
            fi
          fi
