# Publishes the six @markii/* library packages (packages/*, packages/platforms/*)
# to npm — NOT apps/playground, which stays `"private": true` and is skipped
# automatically by `npm publish --workspaces`.
#
# Prerequisites for a real run:
#   1. The `@markii` scope on npmjs.com must be created/owned by the
#      publishing account (or an npm org) with permission to publish these
#      package names.
#   2. An `NPM_TOKEN` repo secret (npm automation/publish token for that
#      scope) must be added under Settings -> Secrets and variables ->
#      Actions.
#   3. Push a `v*.*.*` tag to trigger this workflow.

name: Release (npm)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Builds compiled JS + .d.ts to dist/ for all six library packages, in
      # dependency order (core/stdlib/bundle, then runtime/lua, then react).
      - run: npm run build:dist

      # Publishes every publishable workspace (private:true workspaces,
      # e.g. apps/playground and the root, are skipped automatically by
      # npm). Requires the prerequisites documented above.
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
